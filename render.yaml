services:
  - type: web
    name: resume-analyser
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disks:
      - name: uploads
        mountPath: /opt/render/project/src/uploads
        sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6   # ← THIS FIXES THE ERROR
