services:
  - type: web
    name: CREDX-RESUME-ANALYZER-SUITE
    env: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app
    pythonVersion: "3.11.6"   # ← THIS IS THE GOLDEN LINE
    disks:
      - name: uploads
        mountPath: /opt/render/project/src/uploads
        sizeGB: 1
